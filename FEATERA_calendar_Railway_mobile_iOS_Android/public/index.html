<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f6da2">
  <title>FEATERA 行事曆 APP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="control-panel">
      <div class="control-row">
        <div class="control-group">
          <label>地區
            <select id="countrySelect">
              <option value="taiwan">台灣</option>
              <option value="xiamen">中國廈門</option>
            </select>
          </label>
          <label>年份<select id="yearSelect"></select></label>
          <label>月份<select id="monthSelect"></select></label>
        </div>
        <div class="control-group actions">
          <button id="editTitleBtn" class="btn">修改大標題</button>
          <button id="addEventBtn" class="btn primary">＋ 新增行程</button>
          <button id="exportBtn" class="btn dark">匯出 PNG</button>
          <button id="savePhotoBtn" class="btn mobile-action">儲存圖片</button>
          <button id="shareBtn" class="btn mobile-action share">分享</button>
        </div>
      </div>
      <div class="status-line">提示：點選已有行程可直接修改；點選空白日期可快速新增。</div>
    </section>

    <div class="calendar-scroll" id="calendarScroll">
    <section id="captureArea" class="calendar-canvas">
      <div class="decor decor-a"></div><div class="decor decor-b"></div>
      <div class="decor arc arc-a"></div><div class="decor arc arc-b"></div>
      <header class="calendar-header">
        <div class="featera-logo"><span class="logo-green">FEAT</span><span class="logo-orange">ERA</span></div>
        <h1 id="calendarTitle" class="calendar-title">台灣2026年9月行事曆</h1>
        <div></div>
      </header>
      <div class="weekdays">
        <div>星期一</div><div>星期二</div><div>星期三</div><div>星期四</div><div>星期五</div><div>星期六</div><div>星期日</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
    </div>
  </main>

  <div id="titleModal" class="modal hidden">
    <div class="modal-card small">
      <div class="modal-header"><h2>修改行事曆大標題</h2><button class="icon-btn" id="closeTitleModal" type="button">×</button></div>
      <form id="titleForm">
        <label>大標題<input id="titleInput" type="text" maxlength="80" required></label>
        <div class="modal-actions"><button class="btn" id="cancelTitleBtn" type="button">取消</button><button class="btn primary" type="submit">確認修改</button></div>
      </form>
    </div>
  </div>

  <div id="eventModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header"><h2 id="eventModalTitle">新增行程</h2><button class="icon-btn" id="closeEventModal" type="button">×</button></div>
      <form id="eventForm">
        <input id="eventId" type="hidden">
        <div class="form-grid">
          <label>日期<input id="eventDate" type="date" required></label>
          <label>顏色類型<select id="eventColor"><option value="green">綠色－課程／講堂</option><option value="purple">紫色－大型活動</option><option value="pink">粉色－假期／休息</option><option value="gray">灰色－其他</option><option value="blue">藍色－公告</option></select></label>
          <label>開始時間<input id="eventStart" type="time"></label>
          <label>結束時間<input id="eventEnd" type="time"></label>
          <label class="full">行程標題<input id="eventTitle" type="text" maxlength="80" required placeholder="例如：幸福講堂"></label>
          <label class="full">行程內容<textarea id="eventDesc" rows="6" maxlength="1000" placeholder="主持、主講、地點、備註等"></textarea></label>
          <label>標題字體大小<input id="eventTitleSize" type="number" min="12" max="36" value="18"></label>
          <label>內容字體大小<input id="eventDescSize" type="number" min="10" max="30" value="14"></label>
        </div>
        <div class="modal-actions split"><button id="deleteEventBtn" class="btn danger hidden" type="button">刪除行程</button><div class="right-actions"><button id="cancelEventBtn" class="btn" type="button">取消</button><button class="btn primary" type="submit">確認儲存</button></div></div>
      </form>
    </div>
  </div>



  <div id="imagePreviewModal" class="modal hidden">
    <div class="modal-card preview-card">
      <div class="modal-header"><h2>PNG 預覽</h2><button class="icon-btn" id="closePreviewModal" type="button">×</button></div>
      <div class="preview-body">
        <p id="previewHint" class="preview-hint"></p>
        <img id="previewImage" alt="行事曆 PNG 預覽">
        <div class="preview-actions">
          <button id="previewShareBtn" class="btn primary" type="button">開啟系統分享</button>
          <button id="previewDownloadBtn" class="btn dark" type="button">下載 PNG</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
